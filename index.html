:root{

:root[data-theme="dark"]{

  --accent:#F5B800; --accent-ink:#1B1F3B; --focus:#8D98FF; --bar:#6B76C9; --bar-low:#343A66; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.q{font-size:1.2rem;font-weight:500;min-height:4.2em}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale button b{font-family:var(--display);font-weight:400;font-size:1.4rem}
.scale button span{font-size:.72rem;color:var(--muted)}
.scale button:hover{border-color:var(--accent)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale button[aria-pressed="true"] span{color:var(--accent-ink)}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.78rem;border-radius:6px;padding:2px 8px}
.tag{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.hero{font-family:var(--display);font-size:3rem;line-height:1.1}
dl{margin:0;display:grid;gap:12px}
dt{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
dd{margin:0}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 2em;gap:10px;align-items:center;font-size:.9rem}
.bar .t{height:12px;background:var(--bar-low);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--bar);border-radius:6px}
.bar.top .t i{background:var(--accent)}
.bar.low{color:var(--muted)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.pick button:hover{border-color:var(--accent)}
@media (max-width:420px){.hero{font-size:2.4rem}.bar{grid-template-columns:6em 1fr 1.6em}}
@media (prefers-reduced-motion:reduce){.prog>i{transition:none}}
</style>

 {k:"B",v:"절대 절대 절대 포기하지 않는다",n:"클로저",line:"방법을 바꿔서라도 끝까지 해내는 리더",s:"어려운 과제를 끝까지 마무리해요.",o:"접어야 할 때를 놓치고 팀이 번아웃될 수 있어요.",g:"시작할 때 \"포기 기준(기간·비용)\"을 팀과 함께 적어 두세요.",m:"어려운 과제를 끝낸 뒤 완주를 분명히 인정받고 싶은 팀원에게 잘 맞아요.",b:"지금 막힌 과제에 접는 기준을 정하고, 끝까지 갈 방법 하나만 더 시도해 보세요."},

 {k:"D",v:"사용자가 아닌 팬을 만든다",n:"팬메이커",line:"팀원·타팀·사용자가 우리의 팬이 되게 하는 리더",s:"관계와 신뢰를 쌓아요.",o:"관계 때문에 어려운 결정이 미뤄질 수 있어요.",g:"좋은 관계를 쓰는 만큼, 불편한 이야기도 1:1에서 먼저 꺼내세요.",m:"함께 시간을 보내고 성과를 알아봐 주면 힘을 얻는 팀원에게 잘 맞아요.",b:"이번 주 팀원의 성과 하나를 다른 팀에 먼저 알려 보세요."},

  '<p class="muted">최근 3개월 동안 팀리드로서 실제로 한 행동을 떠올려 답해 주세요. 되고 싶은 모습이 아니라 지금의 나를 고르면 결과가 더 정확해요. 검증된 심리 검사가 아니라 대화를 위한 도구이고, 평가나 인사에 쓰이지 않아요. 결과는 이 화면에만 보이고 저장되지 않아요.</p>'+

function scores(){
  var s=V.map(function(){return 0});

  return s;
}
function ties(s,hi){
  var t=hi?Math.max.apply(null,s):Math.min.apply(null,s);
  return s.map(function(x,n){return x===t?n:-1}).filter(function(n){return n>=0});
}

function result(){
  var s=scores(), tops=ties(s,true), lows=ties(s,false);

    '<div id="gr"></div></div>'+foot();

  h+='<div class="card"><span class="tag">나의 리더 유형</span><div class="hero">'+T.n+'</div><p><span class="badge">주력 가치</span> '+T.v+'</p><p>'+T.line+'</p>'+
  '<dl><div><dt>강점</dt><dd>'+T.s+'</dd></div><div><dt>과용하면</dt><dd>'+T.o+'</dd></div><div><dt>이렇게 다듬어 보세요</dt><dd>'+T.g+'</dd></div><div><dt>이런 팀원에게 잘 맞아요</dt><dd>'+T.m+'</dd></div></dl></div>'+
  '<div class="card"><h2>점수</h2><div class="bars">'+bars+'</div><p class="muted">노란 막대가 주력 가치, 흐린 글자가 성장 가치예요. 점수는 가치별 2문항 합계(2~10점)예요.</p></div>'+
  '<div class="card"><h3>보조 유형 · '+S.n+'</h3><p>'+S.line+'</p></div>'+
  '<div class="card"><span class="badge" style="align-self:flex-start">성장 가치</span><h3>'+G.n+' · '+G.v+'</h3><p>'+G.b+'</p></div>'+foot();
  app.innerHTML=h;
  window._copy=T.n+" (주력: "+T.v+") / 보조: "+S.n+" / 성장 가치: "+G.n+" · 점수 "+V.map(function(v,n){return v.n+" "+s[n]}).join(", ");
  bind();
}
function foot(){
  return '<div class="row"><button class="primary" id="cp">결과 한 줄 복사</button><button class="ghost" id="again">다시 하기</button><span class="muted" id="ok"></span></div>'+
  '<p class="muted">세션에서는 이 결과를 짝과 함께 읽고, "내 성장 가치가 상대의 주력 가치"가 되도록 짝지어 이야기해요.</p>';
}
function bind(){
  document.getElementById("again").onclick=intro;
  var cp=document.getElementById("cp");
  cp.onclick=function(){
    var t=window._copy||"리더 DNA 테스트 결과: 균형형", ok=document.getElementById("ok");
    var fail=function(){ok.textContent="복사가 안 돼요. 화면의 결과를 직접 적어 주세요."};
    try{navigator.clipboard.writeText(t).then(function(){ok.textContent="복사했어요"},fail)}catch(e){fail()}
  };
}
intro();
</script>
